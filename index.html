<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" id="themeFavicon" href="./assets/icons/mind-depot-dark.png">
<script>
/* 涓婚棰勮浇锛氭墦寮€/鍒锋柊鏃跺厛搴旂敤宸蹭繚瀛樹富棰橈紝闃叉闂儊锛團OUC锛? 瀵瑰簲 favicon */
(function () {
  try {
    var t = localStorage.getItem("md_note_theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var fav = document.getElementById("themeFavicon");
    if (fav) {
      var light = t === "light" || ((!t || t === "auto") && window.matchMedia("(prefers-color-scheme: light)").matches);
      fav.href = light ? "./assets/icons/mind-depot-light.png" : "./assets/icons/mind-depot-dark.png";
    }
  } catch (e) { /* 蹇界暐 */ }
})();
</script>
<title>MindDepot Note</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  /* 鈹€鈹€ 涓婚 路 鏃ラ棿锛堥粯璁?/ 寮哄埗浜壊锛?鈹€鈹€ */
  :root, :root[data-theme="light"] {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --border: #d9dfe8;
    --text: #24292f;
    --text-dim: #6b7280;
    --text-strong: #111827;
    --accent: #0d8a77;
    --accent-dim: #4fd6be;
    --code-bg: #f2f4f7;
    --code-text: #333a45;
    --err: #d64545;
    --accent-ink: #ffffff;
    --hover-bg: rgba(15,23,42,.035);
    --shadow: 0 10px 28px rgba(15,23,42,.14);
    --overlay: rgba(15,23,42,.4);
    --tour-mask: rgba(245,246,249,.85);
    --banner-bg: rgba(180,130,0,.07);
    --banner-border: rgba(180,130,0,.3);
    --banner-text: #7a6200;
  }
  /* 鈹€鈹€ 涓婚 路 澶滈棿锛堝己鍒舵殫鑹诧級 鈹€鈹€ */
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1c2230;
    --border: #262e3d;
    --text: #d7dee8;
    --text-dim: #8b94a7;
    --text-strong: #eef2f8;
    --accent: #4fd6be;
    --accent-dim: #2a8f7d;
    --code-bg: #0b0d12;
    --code-text: #c9d4e3;
    --err: #ff6b6b;
    --accent-ink: #05120f;
    --hover-bg: rgba(255,255,255,.02);
    --shadow: 0 10px 28px rgba(0,0,0,.55);
    --overlay: rgba(0,0,0,.55);
    --banner-bg: rgba(255,193,7,.08);
    --banner-border: rgba(255,193,7,.25);
    --banner-text: #e8c468;
  }
  /* 鈹€鈹€ 涓婚 路 璺熼殢绯荤粺锛坅uto锛氭湭璁?data-theme 鏃剁敓鏁堬級 鈹€鈹€ */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --panel: #161a22;
      --panel-2: #1c2230;
      --border: #262e3d;
      --text: #d7dee8;
      --text-dim: #8b94a7;
      --text-strong: #eef2f8;
      --accent: #4fd6be;
      --accent-dim: #2a8f7d;
      --code-bg: #0b0d12;
      --code-text: #c9d4e3;
      --err: #ff6b6b;
      --accent-ink: #05120f;
      --hover-bg: rgba(255,255,255,.02);
      --shadow: 0 10px 28px rgba(0,0,0,.55);
      --overlay: rgba(0,0,0,.55);
      --banner-bg: rgba(255,193,7,.08);
      --banner-border: rgba(255,193,7,.25);
      --banner-text: #e8c468;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 鈹€鈹€ 椤舵爮 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€ */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
    flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand span { color: var(--accent); font-weight: 400; font-size: 12px; margin-left: 2px; }
  .brand .ver { font-weight: 700; margin-left: 4px; }
  .vault-name {
    max-width: 220px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; background: var(--bg);
    font-family: Consolas, monospace;
  }
  .spacer { flex: 1; }
  #searchBox {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    min-width: 120px;
  }
  #searchBox:focus { border-color: var(--accent-dim); }
  button {
    background: var(--accent-dim);
    color: #05120f;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-weight: 400;
  }
  button.ghost:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--panel-2); }
  .msg { font-size: 12px; color: var(--text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.err { color: var(--err); }
  /* 鏈繚瀛樻寚绀猴細淇濆瓨鎸夐挳楂樹寒 */
  #saveBtn.dirty { color: var(--accent); border-color: var(--accent); font-weight: 600; animation: dirtyPulse 2s ease-in-out infinite; }
  @keyframes dirtyPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,214,190,.25); }
    50% { box-shadow: 0 0 0 4px rgba(79,214,190,.08); }
  }
  /* 鑷姩淇濆瓨寮€鍏?+ 淇濆瓨鐘舵€?*/
  .switch { position: relative; display: inline-block; width: 34px; height: 18px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 18px; transition: .2s; cursor: pointer; }
  .slider::before {
    content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px;
    background: var(--panel); border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent-dim); }
  .switch input:checked + .slider::before { transform: translateX(16px); background: var(--bg); }
  .save-state { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .save-state.dirty { color: var(--accent); animation: savePulse 2s ease-in-out infinite; }
  .save-state.saving { color: var(--accent); font-weight: 600; animation: savePulse 1s ease-in-out infinite; }
  .save-state.error { color: var(--err); animation: savePulse 1.2s ease-in-out infinite; }
  @keyframes savePulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 0 rgba(79,214,190,0); }
    50% { opacity: .55; text-shadow: 0 0 8px rgba(79,214,190,.45); }
  }

  .banner {
    flex: none;
    background: var(--banner-bg);
    border-bottom: 1px solid var(--banner-border);
    color: var(--banner-text); font-size: 12px; padding: 6px 16px;
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    position: relative; padding-right: 40px;
  }
  .banner-close {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--banner-text); font-size: 14px; cursor: pointer; padding: 2px 6px;
  }
  .banner-close:hover { color: var(--text); }

  /* 鈹€鈹€ 涓讳綋 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€ */
  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 260px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px 8px 20px;
  }
  .tree-title { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; padding: 4px 10px 8px; text-transform: uppercase; display: flex; align-items: center; }
  .tree-title > span:first-child { flex: 1; }
  .tree-title .ver { color: var(--accent); font-weight: 700; font-size: 11px; margin-right: 4px; flex: none; }
  .tree-actions { display: flex; gap: 2px; }
  .tree-actions button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; }
  .tree-actions button:hover { color: var(--accent); background: var(--bg); }
  .sel-cb { width: 14px; height: 14px; flex: none; accent-color: var(--accent-dim); cursor: pointer; margin: 0; }
  .tree-row.selecting { cursor: pointer; }
  .tree-row.selecting:hover { background: var(--panel-2); }
  #selectActions button { font-size: 11px; padding: 2px 6px; }
  /* 鍕鹃€夋ā寮忔搷浣滄潯 */
  .select-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; margin: 0 8px 6px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px;
  }
  .select-bar .sel-count { color: var(--text-dim); white-space: nowrap; flex: none; }
  .select-bar .sel-btns { display: flex; gap: 4px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
  .select-bar button {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .select-bar button:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--bg); }
  .select-bar button.primary { background: var(--accent-dim); color: #05120f; border-color: transparent; font-weight: 600; }
  .select-bar button.primary:hover { background: var(--accent); }
  /* 鎺掑簭鑿滃崟 */
  .sort-menu {
    position: fixed; z-index: 66; display: none;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px; box-shadow: var(--shadow);
    flex-direction: column; gap: 2px; min-width: 180px;
  }
  .sort-menu.show { display: flex; }
  .sort-menu button {
    background: none; border: none; border-radius: 6px; color: var(--text);
    font-weight: 400; font-size: 13px; text-align: left; padding: 6px 10px; cursor: pointer;
  }
  .sort-menu button:hover { background: var(--bg); color: var(--accent); }
  .sort-menu button.active { color: var(--accent); font-weight: 600; }
  .tree { list-style: none; }
  .tree ul { list-style: none; padding-left: 16px; position: relative; }
  .tree ul.collapsed { display: none; }
  .tree li ul::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; border-left: 1px solid var(--border); }
  .tree li li > .tree-row { position: relative; }
  .tree li li > .tree-row::before { content: ""; position: absolute; left: -12px; top: 50%; width: 12px; border-top: 1px solid var(--border); }
  .tree-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 5px;
    cursor: pointer; font-size: 14px;
    color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tree-row:hover { background: var(--panel-2); color: var(--accent); }
  .tree-row.active { background: var(--panel-2); color: var(--accent); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .tree-row.dir { color: var(--text); }
  .tree-row .arrow { flex: none; width: 14px; text-align: center; color: var(--text-dim); font-size: 11px; }
  .tree-row .ic { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .tree-row .tlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row-actions { display: none; gap: 2px; flex: none; }
  .tree-row:hover .row-actions { display: flex; }
  .row-actions button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 1px 3px; border-radius: 4px; }
  .row-actions button:hover { color: var(--accent); background: var(--bg); }
  .row-actions button.del:hover { color: var(--err); }
  .tree-empty { color: var(--text-dim); font-size: 13px; padding: 12px 10px; text-align: center; }
  .search-suggest {
    padding: 7px 12px; font-size: 13px; color: var(--accent);
    cursor: pointer; border-radius: 6px; list-style: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-suggest:hover { background: var(--panel-2); }
  .search-snippet {
    font-size: 11px; color: var(--text-dim);
    padding: 1px 8px 7px 34px;
    line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-snippet mark { background: rgba(79,214,190,.22); color: var(--text); border-radius: 2px; padding: 0 2px; }

  /* 鍙抽敭鑿滃崟 */
  #ctxMenu {
    position: fixed; z-index: 66;
    display: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: var(--shadow);
    flex-direction: column;
    gap: 2px;
    min-width: 170px;
  }
  #ctxMenu.show { display: flex; }
  #ctxMenu button { background: none; border: none; border-radius: 6px; color: var(--text); font-weight: 400; font-size: 13px; text-align: left; padding: 6px 10px; cursor: pointer; }
  #ctxMenu button:hover { background: var(--bg); color: var(--accent); }
  #ctxMenu button.del:hover { color: var(--err); }

  /* 缂栬緫鍖猴細宸︾紪杈戝櫒 / 鍙抽瑙堬紙妗岄潰锛夛紝涓婁笅鍫嗗彔锛堢Щ鍔級 */
  .editor-area { flex: 1; display: flex; min-width: 0; }
  .editor-pane, .preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane-label {
    flex: none; padding: 5px 14px; font-size: 11px; font-weight: 600;
    letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .pane-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* 绗旇澶х翰瀵艰埅 */
  .editor-pane { position: relative; }
  .editor-tools {
    position: absolute; top: 44px; right: 12px; z-index: 30;
    display: flex; gap: 6px;
  }
  .editor-tools button {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text-dim); font-size: 17px; padding: 5px 10px; cursor: pointer;
    box-shadow: var(--shadow);
  }
  .editor-tools button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .editor-tools .lbl { font-size: 13px; font-weight: 600; }
  .outline-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
  .outline-panel {
    position: absolute; top: 80px; right: 10px; z-index: 31;
    width: 250px; max-height: 60vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 6px; display: none;
  }
  .outline-panel.show { display: block; }
  .outline-nav {
    display: flex; gap: 4px; align-items: center;
    padding: 0 2px 8px; border-bottom: 1px solid var(--border); margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .outline-nav button {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-dim); font-size: 11px; padding: 3px 6px; cursor: pointer;
  }
  .outline-nav button:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--bg); }
  .outline-nav input {
    width: 50px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 3px 5px; font-size: 11px; outline: none;
  }
  .outline-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: var(--text);
    font-size: 12.5px; padding: 5px 8px; border-radius: 5px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .outline-item:hover { background: var(--panel-2); color: var(--accent); }
  .outline-empty { color: var(--text-dim); font-size: 12px; padding: 8px; text-align: center; }
  /* 鈹€鈹€ 鍔ㄧ敾寮忓紩瀵硷紙鑱氬厜鐏級 鈹€鈹€ */
  .tour-mask { position: fixed; inset: 0; z-index: 100; background: transparent; display: none; }
  .tour-spot {
    position: fixed; z-index: 101; border-radius: 8px;
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 9999px var(--tour-mask);
    transition: all .22s ease; pointer-events: none; display: none;
  }
  .tour-card {
    position: fixed; z-index: 102; width: 310px; max-width: 88vw;
    background: var(--panel); border: 1px solid var(--accent-dim);
    border-radius: 10px; padding: 12px 16px 14px; box-shadow: var(--shadow);
    display: none; transition: left .28s ease, top .28s ease;
  }
  .tour-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .tour-top .step { font-size: 11px; color: var(--accent); letter-spacing: 1px; font-weight: 600; }
  .tour-top a { font-size: 11px; color: var(--text-dim); text-decoration: none; cursor: pointer; }
  .tour-top a:hover { color: var(--err); }
  .tour-card h3 { font-size: 14px; color: var(--text-strong); margin: 0 0 6px; }
  .tour-card p { font-size: 12.5px; color: var(--text-dim); line-height: 1.65; margin: 0; }
  .tour-nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .tour-nav button { font-size: 12px; padding: 5px 10px; }
  .tour-dots { flex: 1; min-width: 0; overflow: hidden; display: flex; gap: 3px; justify-content: center; }
  .tour-dots .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); flex: none; }
  .tour-dots .dot.active { background: var(--accent); }
  .tour-action { width: 100%; margin-top: 10px; padding: 6px 0 !important; }
  #noteTitle {
    flex: 1; min-width: 0; padding: 9px 14px; font-size: 15px; font-weight: 600;
    background: var(--panel); color: var(--text-strong);
    border: none; border-bottom: 1px solid var(--border); outline: none;
  }
  .title-row { display: flex; align-items: center; flex: none; min-width: 0; }
  .title-nav {
    display: flex; gap: 4px; align-items: center; flex: none;
    padding: 0 10px; border-bottom: 1px solid var(--border); align-self: stretch;
  }
  .title-nav button {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-dim); font-size: 11px; padding: 3px 6px; cursor: pointer; white-space: nowrap;
  }
  .title-nav button:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--bg); }
  .title-nav input {
    width: 50px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 3px 5px; font-size: 11px; outline: none;
  }
  #noteTitle::placeholder { color: var(--text-dim); font-weight: 400; }
  #editorText {
    flex: 1; min-height: 0; width: 100%;
    background: var(--code-bg); color: var(--text);
    border: none; padding: 14px 16px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13.5px; line-height: 1.65;
    resize: none; outline: none;
  }

  /* 鈹€鈹€ 鍧楃紪杈戝櫒 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€ */
  .block-editor { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 90px; }
  .note-stats {
