<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" id="themeFavicon" href="./mdutils_dark_theme.png">
<script>
/* 主题预载：打开/刷新时先应用已保存主题，防止闪烁（FOUC） */
(function () {
  try {
    var t = localStorage.getItem("md_note_theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var fav = document.getElementById("themeFavicon");
    if (fav) {
      var light = t === "light" || (!t && window.matchMedia("(prefers-color-scheme: light)").matches);
      fav.href = light ? "./mdutils_light_theme.png" : "./mdutils_dark_theme.png";
    }
  } catch (e) { /* 忽略 */ }
})();
</script>
<title>MindDepot Note</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  /* ── 主题 · 日间（默认 / 强制亮色） ── */
  :root, :root[data-theme="light"] {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --border: #d9dfe8;
    --text: #24292f;
    --text-dim: #6b7280;
    --text-strong: #111827;
    --accent: #0d8a77;
    --accent-dim: #4fd6be;
    --code-bg: #f2f4f7;
    --code-text: #333a45;
    --err: #d64545;
    --accent-ink: #ffffff;
    --hover-bg: rgba(15,23,42,.035);
    --shadow: 0 10px 28px rgba(15,23,42,.14);
    --overlay: rgba(15,23,42,.4);
    --banner-bg: rgba(180,130,0,.07);
    --banner-border: rgba(180,130,0,.3);
    --banner-text: #7a6200;
  }
  /* ── 主题 · 夜间（强制暗色） ── */
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1c2230;
    --border: #262e3d;
    --text: #d7dee8;
    --text-dim: #8b94a7;
    --text-strong: #eef2f8;
    --accent: #4fd6be;
    --accent-dim: #2a8f7d;
    --code-bg: #0b0d12;
    --code-text: #c9d4e3;
    --err: #ff6b6b;
    --accent-ink: #05120f;
    --hover-bg: rgba(255,255,255,.02);
    --shadow: 0 10px 28px rgba(0,0,0,.55);
    --overlay: rgba(0,0,0,.55);
    --banner-bg: rgba(255,193,7,.08);
    --banner-border: rgba(255,193,7,.25);
    --banner-text: #e8c468;
  }
  /* ── 主题 · 跟随系统（auto：未设 data-theme 时生效） ── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --panel: #161a22;
      --panel-2: #1c2230;
      --border: #262e3d;
      --text: #d7dee8;
      --text-dim: #8b94a7;
      --text-strong: #eef2f8;
      --accent: #4fd6be;
      --accent-dim: #2a8f7d;
      --code-bg: #0b0d12;
      --code-text: #c9d4e3;
      --err: #ff6b6b;
      --accent-ink: #05120f;
      --hover-bg: rgba(255,255,255,.02);
      --shadow: 0 10px 28px rgba(0,0,0,.55);
      --overlay: rgba(0,0,0,.55);
      --banner-bg: rgba(255,193,7,.08);
      --banner-border: rgba(255,193,7,.25);
      --banner-text: #e8c468;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 顶栏 ─────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
    flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand span { color: var(--accent); font-weight: 400; font-size: 12px; margin-left: 2px; }
  .vault-name {
    max-width: 220px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; background: var(--bg);
    font-family: Consolas, monospace;
  }
  .spacer { flex: 1; }
  #searchBox {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    min-width: 120px;
  }
  #searchBox:focus { border-color: var(--accent-dim); }
  button {
    background: var(--accent-dim);
    color: #05120f;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-weight: 400;
  }
  button.ghost:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--panel-2); }
  .msg { font-size: 12px; color: var(--text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.err { color: var(--err); }

  .banner {
    flex: none;
    background: var(--banner-bg);
    border-bottom: 1px solid var(--banner-border);
    color: var(--banner-text); font-size: 12px; padding: 6px 16px;
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    position: relative; padding-right: 40px;
  }
  .banner-close {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--banner-text); font-size: 14px; cursor: pointer; padding: 2px 6px;
  }
  .banner-close:hover { color: var(--text); }

  /* ── 主体 ─────────────────────────── */
  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 260px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px 8px 20px;
  }
  .tree-title { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; padding: 4px 10px 8px; text-transform: uppercase; display: flex; align-items: center; }
  .tree-title > span:first-child { flex: 1; }
  .tree-actions { display: flex; gap: 2px; }
  .tree-actions button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; }
  .tree-actions button:hover { color: var(--accent); background: var(--bg); }
  .tree { list-style: none; }
  .tree ul { list-style: none; padding-left: 16px; position: relative; }
  .tree ul.collapsed { display: none; }
  .tree li ul::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; border-left: 1px solid var(--border); }
  .tree li li > .tree-row { position: relative; }
  .tree li li > .tree-row::before { content: ""; position: absolute; left: -12px; top: 50%; width: 12px; border-top: 1px solid var(--border); }
  .tree-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 5px;
    cursor: pointer; font-size: 14px;
    color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tree-row:hover { background: var(--panel-2); color: var(--accent); }
  .tree-row.active { background: var(--panel-2); color: var(--accent); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .tree-row.dir { color: var(--text); }
  .tree-row .arrow { flex: none; width: 14px; text-align: center; color: var(--text-dim); font-size: 11px; }
  .tree-row .ic { flex: none; width: 20px; text-align: center; font-size: 15px; }
  .tree-row .tlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row-actions { display: none; gap: 2px; flex: none; }
  .tree-row:hover .row-actions { display: flex; }
  .row-actions button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 1px 3px; border-radius: 4px; }
  .row-actions button:hover { color: var(--accent); background: var(--bg); }
  .row-actions button.del:hover { color: var(--err); }
  .tree-empty { color: var(--text-dim); font-size: 13px; padding: 12px 10px; text-align: center; }

  /* 右键菜单 */
  #ctxMenu {
    position: fixed; z-index: 66;
    display: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: var(--shadow);
    flex-direction: column;
    gap: 2px;
    min-width: 170px;
  }
  #ctxMenu.show { display: flex; }
  #ctxMenu button { background: none; border: none; border-radius: 6px; color: var(--text); font-weight: 400; font-size: 13px; text-align: left; padding: 6px 10px; cursor: pointer; }
  #ctxMenu button:hover { background: var(--bg); color: var(--accent); }
  #ctxMenu button.del:hover { color: var(--err); }

  /* 编辑区：左编辑器 / 右预览（桌面），上下堆叠（移动） */
  .editor-area { flex: 1; display: flex; min-width: 0; }
  .editor-pane, .preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane-label {
    flex: none; padding: 5px 14px; font-size: 11px; font-weight: 600;
    letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .pane-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  #noteTitle {
    flex: none; padding: 9px 14px; font-size: 15px; font-weight: 600;
    background: var(--panel); color: var(--text-strong);
    border: none; border-bottom: 1px solid var(--border); outline: none;
  }
  #noteTitle::placeholder { color: var(--text-dim); font-weight: 400; }
  #editorText {
    flex: 1; min-height: 0; width: 100%;
    background: var(--code-bg); color: var(--text);
    border: none; padding: 14px 16px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13.5px; line-height: 1.65;
    resize: none; outline: none;
  }

  /* ── 块编辑器 ─────────────────────── */
  .block-editor { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 90px; }
  .block {
    position: relative;
    display: flex;
    gap: 6px;
    align-items: flex-start;
    padding: 1px 0;
    border-radius: 4px;
  }
  .block:hover { background: var(--hover-bg); }
  .block .b-mark {
    flex: none; width: 24px; text-align: center;
    color: var(--text-dim); user-select: none;
    font-size: 13px; line-height: 1.8; padding-top: 3px;
    font-family: Consolas, monospace;
  }
  .block .b-content {
    flex: 1; min-width: 0;
    outline: none;
    line-height: 1.7; font-size: 15px;
    padding: 3px 0;
    word-break: break-word;
  }
  .block .b-content:empty::before { content: attr(data-ph); color: var(--text-dim); }
  .block .b-content code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-family: Consolas, monospace; font-size: .88em; color: var(--accent); }
  .block .b-content a { color: var(--accent); text-decoration: none; }
  .block .b-content a:hover { text-decoration: underline; }
  .block.b-heading .b-content { font-weight: 600; color: var(--text-strong); }
  .block.b-h1 .b-content { font-size: 1.9em; }
  .block.b-h2 .b-content { font-size: 1.5em; }
  .block.b-h3 .b-content { font-size: 1.25em; }
  .block.b-h4 .b-content { font-size: 1.1em; }
  .block.b-quote .b-content { border-left: 3px solid var(--accent-dim); padding-left: 12px; color: var(--text-dim); }
  .block.b-code .b-content {
    font-family: Consolas, "Courier New", monospace;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.6;
  }
  .block.b-divider { align-items: center; padding: 8px 0; }
  .block.b-divider .b-content { flex: none; width: 100%; height: 1px; background: var(--border); }
  .block.b-todo .b-mark { display: flex; justify-content: center; align-items: center; padding-top: 0; }
  .block.b-todo input[type="checkbox"] { accent-color: var(--accent-dim); cursor: pointer; width: 15px; height: 15px; }
  .block.b-todo .b-content { color: var(--text); }
  .b-controls {
    position: absolute; left: -30px; top: 2px;
    display: none; gap: 1px;
  }
  .block:hover .b-controls { display: flex; }
  .b-controls button {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 12px; padding: 1px 4px; border-radius: 4px;
  }
  .b-controls button:hover { color: var(--accent); background: var(--bg); }
  .b-controls button.del:hover { color: var(--err); }

  /* 弹出菜单（/ 菜单、块菜单） */
  .pop-menu {
    position: fixed; z-index: 68;
    display: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: var(--shadow);
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    max-height: 320px;
    overflow-y: auto;
  }
  .pop-menu.show { display: flex; }
  .pop-menu button {
    background: none; border: none; border-radius: 6px;
    color: var(--text); font-weight: 400; font-size: 13px;
    text-align: left; padding: 6px 10px; cursor: pointer;
  }
  .pop-menu button:hover { background: var(--bg); color: var(--accent); }
  .pop-menu .pop-title {
    font-size: 11px; color: var(--text-dim);
    padding: 4px 10px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  #preview {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 14px 20px 60px;
    font-size: 14px; line-height: 1.75;
  }
  #preview h1, #preview h2, #preview h3, #preview h4 { color: var(--text-strong); margin: 1.3em 0 .5em; line-height: 1.3; }
  #preview h1 { font-size: 1.6em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  #preview h2 { font-size: 1.3em; }
  #preview h3 { font-size: 1.1em; color: var(--accent); }
  #preview p { margin: .6em 0; }
  #preview a { color: var(--accent); text-decoration: none; }
  #preview strong { color: var(--text-strong); }
  #preview code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: Consolas, monospace; color: var(--accent); }
  #preview pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: .8em 0; }
  #preview pre code { background: none; border: none; padding: 0; color: var(--code-text); font-size: 12.5px; }
  #preview blockquote { border-left: 3px solid var(--accent-dim); background: var(--panel); padding: 8px 12px; margin: .8em 0; border-radius: 0 6px 6px 0; color: var(--text-dim); }
  #preview table { border-collapse: collapse; margin: .8em 0; font-size: 13px; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  #preview th { background: var(--panel-2); }
  #preview ul, #preview ol { padding-left: 1.5em; margin: .5em 0; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
  #preview img { max-width: 100%; border-radius: 6px; }
  .empty-hint { color: var(--text-dim); text-align: center; margin-top: 30vh; }

  /* 预览区区块编辑：🖊 悬停 + 添加分割线 */
  .heading-edit {
    display: inline-block; visibility: hidden; margin-left: 6px;
    background: none; border: none; color: var(--text-dim);
    font-size: 0.8em; line-height: 1; padding: 0 3px; cursor: pointer; vertical-align: baseline;
  }
  .heading-edit:hover { color: var(--accent); }
  #preview :is(h1,h2,h3,h4,h5,h6):hover .heading-edit { visibility: visible; }
  .sec { margin: 0; }
  .sec-add { display: flex; align-items: center; gap: 12px; margin: 6px 0 2px; opacity: 0; transition: opacity .15s; }
  .sec-add::before, .sec-add::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .sec-add button {
    background: none; border: 1px dashed var(--border); color: var(--text-dim);
    font-size: 12px; padding: 3px 14px; border-radius: 20px; font-weight: 400; cursor: pointer; white-space: nowrap;
  }
  .sec:hover + .sec-add, .sec-add:hover { opacity: 1; }
  .sec-add button:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--panel-2); }

  /* 结构化编辑面板（右侧滑出） */
  .edit-overlay {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: 420px; background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .25s ease;
  }
  .edit-overlay.show { transform: translateX(0); }
  .edit-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .edit-head .t { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .edit-head .s { flex: 1; min-width: 0; color: var(--text-dim); font-size: 12px; font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-head .close { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }
  .edit-head .close:hover { color: var(--err); }
  .editor-mode { display: flex; gap: 8px; padding: 10px 14px 0; }
  .editor-mode button { background: transparent; color: var(--text-dim); border: 1px solid var(--border); font-weight: 400; padding: 5px 12px; border-radius: 6px; font-size: 12px; }
  .editor-mode button.active { background: var(--accent-dim); color: #05120f; border-color: var(--accent-dim); font-weight: 600; }
  .editor-toolbar { position: relative; display: flex; gap: 8px; padding: 10px 14px 0; }
  .editor-toolbar button { background: transparent; color: var(--text-dim); border: 1px solid var(--border); font-weight: 400; padding: 5px 12px; border-radius: 6px; font-size: 12px; }
  .editor-toolbar button:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--panel-2); }
  .insert-menu {
    position: absolute; top: calc(100% + 4px); left: 14px; z-index: 65;
    display: none; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 390px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px; box-shadow: var(--shadow);
  }
  .insert-menu.show { display: grid; }
  .insert-menu button { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text-dim); font-weight: 400; font-size: 11px; padding: 7px 4px; cursor: pointer; }
  .insert-menu button:hover { color: var(--accent); border-color: var(--border); background: var(--bg); }
  .insert-menu .sym { font-size: 15px; line-height: 1.2; }
  #editText {
    flex: 1; min-height: 120px; width: 100%; margin-top: 10px;
    background: var(--code-bg); color: var(--text); border: none;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 14px; font-family: Consolas, "Courier New", monospace;
    font-size: 13.5px; line-height: 1.6; resize: none; outline: none;
  }
  .edit-divider {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
  }
  .edit-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  #editPreview { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 40px; font-size: 13px; line-height: 1.7; }
  #editPreview h1, #editPreview h2, #editPreview h3 { color: var(--text-strong); margin: 1em 0 .4em; }
  #editPreview h1 { font-size: 1.4em; } #editPreview h2 { font-size: 1.2em; } #editPreview h3 { font-size: 1.05em; color: var(--accent); }
  #editPreview p { margin: .5em 0; }
  #editPreview code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: Consolas, monospace; color: var(--accent); }
  #editPreview pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  #editPreview blockquote { border-left: 3px solid var(--accent-dim); background: var(--panel-2); padding: 6px 10px; margin: .6em 0; color: var(--text-dim); }
  #editPreview table { border-collapse: collapse; margin: .6em 0; font-size: 12px; }
  #editPreview th, #editPreview td { border: 1px solid var(--border); padding: 4px 8px; }
  .edit-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
  .edit-foot .hint { flex: 1; font-size: 11px; color: var(--text-dim); }
  .edit-foot button { font-size: 12px; padding: 6px 14px; }

  /* 编辑器悬停功能气泡 + 统一弹窗 */
  #funcBubble {
    position: fixed; z-index: 56;
    display: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: var(--shadow);
    flex-direction: column;
    gap: 2px;
    min-width: 160px;
  }
  #funcBubble.show { display: flex; }
  #funcBubble button {
    background: none; border: none; border-radius: 6px;
    color: var(--text); font-weight: 400; font-size: 13px;
    text-align: left; padding: 6px 10px; cursor: pointer;
  }
  #funcBubble button:hover { background: var(--bg); color: var(--accent); }
  #funcBubble .bub-title {
    font-size: 11px; color: var(--text-dim);
    padding: 4px 10px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 70; }
  .overlay.show { display: flex; }
  .modal { width: 360px; max-width: 92vw; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .modal-head .close { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }
  .modal-head .close:hover { color: var(--err); }
  .modal-body { padding: 14px 16px; }
  .modal-body input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 12px; font-size: 13px; outline: none; font-family: Consolas, monospace;
  }
  .modal-body input:focus { border-color: var(--accent-dim); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .modal-foot button { font-size: 12px; padding: 6px 14px; }

  /* 移动端抽屉 */
  .drawer-btn, .backdrop { display: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

  @media (max-width: 768px) {
    header { gap: 8px; padding: 8px 10px; }
    .brand span { display: none; }
    .vault-name { max-width: 130px; }
    .msg { display: none; }
    .theme-lbl { display: none; }
    button { padding: 6px 10px; font-size: 12px; }
    .drawer-btn {
      display: block;
      position: fixed; left: 10px; bottom: 16px; z-index: 40;
      width: 44px; height: 44px; border-radius: 50%; font-size: 18px; padding: 0;
      box-shadow: var(--shadow);
    }
    .backdrop { position: fixed; inset: 0; z-index: 44; background: var(--overlay); }
    .backdrop.show { display: block; }
    aside {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 45;
      width: min(78vw, 300px);
      transform: translateX(-100%);
      transition: transform .25s ease;
      box-shadow: 4px 0 20px var(--shadow);
    }
    aside.show { transform: translateX(0); }
    .tree-title { font-size: 11px; }
    .tree-row { font-size: 13px; padding: 4px 8px; }
    .tree-row .ic { width: 18px; font-size: 13px; }
    .tree-row .arrow { font-size: 10px; }
    .editor-area { flex-direction: column; }
    .editor-pane { flex: 1 1 45%; }
    .preview-pane { flex: 1 1 55%; border-top: 1px solid var(--border); }
    .banner { padding: 6px 36px 6px 12px; font-size: 11px; }
    .edit-overlay { width: 100%; }
    .insert-menu { width: calc(100vw - 28px); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">🦊 MindDepot<span>Note</span></div>
  <span class="vault-name" id="vaultName" title="未打开笔记库">未打开笔记库</span>
  <div class="spacer"></div>
  <input id="searchBox" placeholder="🔍 搜索笔记…" spellcheck="false">
  <button type="button" id="newNoteBtn" class="ghost" disabled>➕ 新建笔记</button>
  <button type="button" id="openVaultBtn">📂 打开笔记库</button>
  <button type="button" id="saveBtn" class="ghost" disabled>💾 保存</button>
  <button type="button" id="themeBtn" class="ghost" title="主题：跟随系统">🖥<span class="theme-lbl"> 主题</span></button>
  <div class="msg" id="msg"></div>
</header>

<div class="banner" id="banner">
  <span>🔒 本地优先：笔记数据只在你自己的设备/浏览器里，不经过任何服务器。电脑与安卓（Chrome/Edge）可用真实文件夹，iPhone/iPad 使用浏览器私有存储。</span>
  <button class="banner-close" id="bannerClose" title="关闭提示">✕</button>
</div>

<main>
  <button type="button" id="drawerBtn" class="drawer-btn" title="笔记列表">☰</button>
  <div class="backdrop" id="backdrop"></div>
  <aside id="treeAside">
    <div class="tree-title"><span>笔记库</span><span class="tree-actions"><button id="newFolderBtn" title="新建文件夹">📁</button><button id="newNoteBtn" title="新建笔记">➕</button></span></div>
    <ul class="tree" id="tree"></ul>
  </aside>

  <section class="editor-area">
    <div class="editor-pane">
      <input id="noteTitle" placeholder="笔记标题（回车插入标题块）" spellcheck="false" disabled>
      <div id="blockEditor" class="block-editor"></div>
      <textarea id="editorText" style="display:none" spellcheck="false" disabled></textarea>
    </div>
  </section>
</main>

<!-- 结构化编辑面板（右侧滑出） -->
<div class="edit-overlay" id="editPanel">
  <div class="edit-head">
    <span class="t">✎ 编辑区块</span>
    <span class="s" id="editHeadingLabel"></span>
    <button class="close" id="editClose" title="关闭 (Esc)">✕</button>
  </div>
  <div class="editor-mode">
    <button type="button" id="modeReplace" class="active">替换区块内容</button>
    <button type="button" id="modeInsert">标题后插入</button>
    <button type="button" id="modeAdd">＋ 添加区块</button>
  </div>
  <div class="editor-toolbar">
    <button type="button" id="insertBtn" class="ghost">⨁ 插入 ▾</button>
    <div class="insert-menu" id="insertMenu">
      <button type="button" data-insert="h1"><span class="sym">H1</span>主标题</button>
      <button type="button" data-insert="h2"><span class="sym">H2</span>副标题</button>
      <button type="button" data-insert="h3"><span class="sym">H3</span>三级标题</button>
      <button type="button" data-insert="bold"><span class="sym">𝐁</span>加粗</button>
      <button type="button" data-insert="italic"><span class="sym">𝐼</span>斜体</button>
      <button type="button" data-insert="strike"><span class="sym">S̶</span>删除线</button>
      <button type="button" data-insert="inline-code"><span class="sym">`</span>行内代码</button>
      <button type="button" data-insert="quote"><span class="sym">❝</span>引用</button>
      <button type="button" data-insert="ul"><span class="sym">•</span>无序列表</button>
      <button type="button" data-insert="ol"><span class="sym">1.</span>有序列表</button>
      <button type="button" data-insert="task"><span class="sym">☑</span>任务列表</button>
      <button type="button" data-insert="link"><span class="sym">🔗</span>链接</button>
      <button type="button" data-insert="image"><span class="sym">🖼</span>图片</button>
      <button type="button" data-insert="code"><span class="sym">{ }</span>代码块</button>
      <button type="button" data-insert="table"><span class="sym">▦</span>表格</button>
      <button type="button" data-insert="hr"><span class="sym">—</span>分割线</button>
      <button type="button" data-insert="toc"><span class="sym">☰</span>目录</button>
    </div>
  </div>
  <textarea id="editText" spellcheck="false" placeholder="# 在此编辑 Markdown…（Tab 缩进）"></textarea>
  <div class="edit-divider">预览</div>
  <div id="editPreview"></div>
  <div class="edit-foot">
    <button id="editSave" class="primary">💾 保存</button>
    <button id="editDelete" class="ghost danger" style="color:var(--err);border-color:var(--err)">🗑 删除区块</button>
    <button id="editCancel" class="ghost">取消</button>
    <span class="hint" id="editHint">替换 = 覆盖该标题下的内容</span>
  </div>
</div>

<!-- 编辑器悬停功能气泡 -->
<div id="funcBubble"></div>

<!-- 统一风格弹窗：新建笔记 -->
<div class="overlay" id="nameOverlay">
  <div class="modal">
    <div class="modal-head">
      <span id="nameModalTitle">➕ 新建笔记</span>
      <button class="close" id="nameClose" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <input id="nameInput" placeholder="笔记名称（.md 自动补全）" spellcheck="false">
    </div>
    <div class="modal-foot">
      <button id="nameCancel" class="ghost">取消</button>
      <button id="nameOk" class="primary">创建</button>
    </div>
  </div>
</div>

<!-- 右键菜单 -->
<div id="ctxMenu"></div>

<!-- 块编辑器弹出菜单 -->
<div id="slashMenu" class="pop-menu"></div>
<div id="blockMenu" class="pop-menu"></div>

<script src="./marked.min.js"></script>
<script src="./highlight.min.js"></script>
<script src="./mdutils.js"></script>
<script src="./blocks.js"></script>
<script src="./app.js"></script>
</body>
</html>
